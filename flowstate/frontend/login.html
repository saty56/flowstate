<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In – FlowState</title>
    <link rel="icon" href="logo.webp" type="image/webp" />
    <link rel="stylesheet" href="style.css?v=10" />
    <script>
        // 1. Handle OAuth Callback immediately
        const params = new URLSearchParams(window.location.search);
        if (params.has('token')) {
            localStorage.setItem('fs_token', params.get('token'));
            localStorage.setItem('fs_uid', params.get('userId'));
            const isDone = params.get('onboarded') === 'true';
            window.location.href = isDone ? `dashboard.html?userId=${params.get('userId')}` : `onboard.html?userId=${params.get('userId')}`;
        }
        // 2. Otherwise handle normal auth check
        else if (localStorage.getItem('fs_uid')) {
            window.location.href = 'dashboard.html?userId=' + localStorage.getItem('fs_uid');
        }
    </script>
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            padding: 40px;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-card);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-title {
            font-size: 2rem;
            font-weight: 800;
            color: white;
            margin-bottom: 8px;
        }

        .auth-sub {
            color: var(--text-2);
            font-size: 0.95rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--text-3);
        }

        .auth-footer a {
            color: var(--primary-light);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="bg-orbs" style="opacity:0.35;">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>
    <div class="bg-grid" style="opacity:0.4;"></div>

    <div class="toast-stack" id="toastStack"></div>

    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo" style="justify-content:center;margin-bottom:24px;">
                    <div class="logo-mark">
                        <img src="logo.webp" alt="logo" />
                    </div>
                    <span class="logo-name">FlowState</span>
                </a>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-sub">Log in to view your dashboard.</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="fg">
                    <label class="fg-label" for="email">Email</label>
                    <input type="email" id="email" class="f-input" placeholder="you@domain.com" required />
                </div>
                <div class="fg">
                    <label class="fg-label" for="password">Password</label>
                    <input type="password" id="password" class="f-input" placeholder="••••••••" required />
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;" id="submitBtn">
                    <span id="submitTxt">Log In</span>
                    <div class="spin" id="submitSpin" style="display:none;margin:0 auto;"></div>
                </button>

                <div class="auth-divider">
                    <span>or continue with</span>
                </div>

                <div class="social-login">
                    <button type="button" class="btn btn-ghost social-btn" onclick="socialLogin('google')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        <span>Google</span>
                    </button>
                    <button type="button" class="btn btn-ghost social-btn" onclick="socialLogin('github')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="white"/>
                        </svg>
                        <span>GitHub</span>
                    </button>
                </div>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign up</a>
            </div>
        </div>
    </main>

    <script>
        const API = 'http://localhost:3000';

        function toast(msg, type = 'ok') {
            const s = document.getElementById('toastStack');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          ${type === 'ok' ? '<polyline points="20 6 9 17 4 12"/>' : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}
        </svg>
        <span>${msg}</span>`;
            s.appendChild(el);
            setTimeout(() => el.remove(), 5000);
        }

        function socialLogin(provider) {
            window.location.href = `${API}/api/auth/${provider}`;
        }

        // Show error message if OAuth failed
        const _loginParams = new URLSearchParams(window.location.search);
        if (_loginParams.has('error')) {
            setTimeout(() => toast('Social login failed: ' + _loginParams.get('error'), 'err'), 500);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const em = document.getElementById('email').value.trim();
            const pw = document.getElementById('password').value.trim();

            const btn = document.getElementById('submitBtn');
            const txt = document.getElementById('submitTxt');
            const spin = document.getElementById('submitSpin');

            btn.disabled = true; txt.style.display = 'none'; spin.style.display = 'block';

            try {
                const res = await fetch(`${API}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: em, password: pw })
                });
                const data = await res.json();

                btn.disabled = false; txt.style.display = 'inline'; spin.style.display = 'none';

                if (res.ok) {
                    localStorage.setItem('fs_token', data.token);
                    localStorage.setItem('fs_user', JSON.stringify(data.user));
                    localStorage.setItem('fs_uid', data.user.id);
                    // Conditional redirect using Hash Fragment (#)
                    if (!data.user.onboarded) {
                        window.location.href = `onboard.html#userId=${data.user.id}&token=${data.token}`;
                    } else {
                        window.location.href = `dashboard.html#userId=${data.user.id}&token=${data.token}`;
                    }
                } else {
                    toast(data.error || 'Login failed', 'err');
                }
            } catch (err) {
                toast('Network error — is backend running?', 'err');
                btn.disabled = false; txt.style.display = 'inline'; spin.style.display = 'none';
            }
        }
    </script>
</body>

</html>
